name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run focused tests
        run: npm test

      - name: Validate data
        run: npm run validate:data

      - name: Lint
        run: npm run lint

      - name: Tool page interaction tests
        run: npm run test:ui

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Real browser verification
        run: |
          npm start &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:web
