name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run focused tests
        run: npm test

      - name: Validate data
        run: npm run validate:data

      - name: Lint
        run: npm run lint

      - name: Tool page interaction tests
        run: npm run test:ui

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start production server
        run: |
          npm start > /tmp/globokit-start.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/ > /dev/null; then
              echo "server ready after ${attempt} attempts"
              exit 0
            fi
            sleep 2
          done
          echo 'server did not become ready'
          cat /tmp/globokit-start.log
          exit 1

      - name: Real browser verification
        run: npm run test:web
